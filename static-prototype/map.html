<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shoreline Map Panel</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Main scrollable side panel -->
     <div class = "topbar">
     <div class="header">
          <div class="icon-container">
            <div class="icon-wrapper">
              <div class="icon-shape"></div>
            </div>
          </div>
          <div class="title-container">
            <div class="main-title">Shoreline Map</div>
            <div class="sub-title">Mississauga–Oakville</div>
          </div>
        </div>

     </div>
    <div class="sidebar">
      <!-- Content cards container -->
      <div class="content-container">
        <!-- Shoreline Map Header -->
        <div class="header">
          <div class="icon-container">
            <div class="icon-wrapper">
              <div class="icon-shape"></div>
            </div>
          </div>
          <div class="title-container">
            <div class="main-title">Park name</div>
            <div class="sub-title">park subtititle</div>
          </div>
        </div>

        <!-- Image Preview Card -->
        <div class="card">
          <div class="card-header">
            <div class="badge">
              <div class="badge-icon-wrapper">
                <div class="badge-icon"></div>
              </div>
              <div class="badge-text">Image</div>
            </div>
            <div class="card-type">Preview</div>
          </div>
          <div class="image-placeholder">
            <div class="image-text">IMG</div>
          </div>
          <div class="card-description">
            Select a shoreline location to explore beach information.
          </div>
        </div>

        <!-- Shoreline Overview Card -->
        <div class="card">
          <div class="card-header">
            <div class="badge">
              <div class="badge-icon-wrapper">
                <div class="badge-icon"></div>
              </div>
              <div class="badge-text">Shoreline overview</div>
            </div>
            <div class="card-type">Overview</div>
          </div>
          <div class="stats-title">Beach stats</div>
          <text>temperature</text>
          <text>safe to swim</text>
          <text>stars</text>
          <text>...</text>
        </div>
        <div class="card">
          <div class="card-header">
            <div class="badge">
              <div class="badge-icon-wrapper">
                <div class="badge-icon"></div>
              </div>
              <div class="badge-text">Events</div>
            </div>
            <div class="card-type">Latest Event</div>
          </div>
          <div class="stats-title">Event</div>
        <div class="card" style="background-color: grey;">
          <div class="card-header">Event1</div>
        </div>
        <div class="card" style="background-color: grey;">
          <div class="card-header">Event2</div>
        </div>
        <div class="card" style="background-color: grey;">
          <div class="card-header">Event3</div>
        </div>
        <div class="card" style="background-color: grey;">
          <div class="card-header">Event4</div>
        </div>
      </div>
    </div>
  </body>
</html>
